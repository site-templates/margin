# The visual editor's contract for sections/cta.blade.php.
title: Closing panel
description: The white panel that closes every page — heading, one line, two buttons
fields:
    heading:
        type: text
        label: Heading
        default: "Start on the page you are already writing."
    body:
        type: textarea
        label: One line
        rows: 3
        default: "Free for up to ten people, and your first agent runs on day one."
    ctaText:
        type: text
        label: Button text
        default: "Start free"
    ctaLink:
        type: url
        label: Button link
        default: "#"
    showSecondary:
        type: toggle
        label: Show the second button
        default: "1"
    secondaryText:
        type: text
        label: Second button text
        default: "Book a demo"
    secondaryLink:
        type: url
        label: Second button link
        default: "#"
